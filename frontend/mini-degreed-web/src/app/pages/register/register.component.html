<div class="container">
  <div class="card">
    <h1>Mini Degreed</h1>
    <h2>Criar conta</h2>

    <div class="error" *ngIf="error">{{ error }}</div>
    <div class="success" *ngIf="success">{{ success }}</div>

    <input type="email" placeholder="Email" [(ngModel)]="email" />
    <input type="password" placeholder="Senha" [(ngModel)]="password" />
    <button (click)="register()">Criar conta</button>

    <p>Já tem conta? <a routerLink="/login">Entrar</a></p>
  </div>
</div>
